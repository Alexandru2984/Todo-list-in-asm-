# http context. Global real-IP trust is managed separately by the VPS operator.
# Never trust client-supplied forwarded addresses in the Assembly process.
log_format asm_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
map $request_method $asm_write_key {
    default "";
    POST $binary_remote_addr;
}
map "$request_method:$uri" $asm_session_key {
    default "";
    "POST:/start" $binary_remote_addr;
    "POST:/restore" $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=asm_read:1m rate=5r/s;
limit_req_zone $asm_write_key zone=asm_write:1m rate=30r/m;
limit_req_zone $asm_session_key zone=asm_session:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=asm_conn:1m;
limit_conn_zone $server_name zone=asm_total:1m;

map $uri $asm_import_key {
    default "";
    /import-preview $server_name;
    /import $server_name;
}
limit_conn_zone $asm_import_key zone=asm_import_total:1m;
