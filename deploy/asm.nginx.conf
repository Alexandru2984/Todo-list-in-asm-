server {
    listen 80;
    listen [::]:80;
    server_name asm.micutu.com;
    access_log /var/log/nginx/asm-canary.access.log asm_private;
    error_log /var/log/nginx/asm-canary.error.log warn;
    return 301 https://asm.micutu.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name asm.micutu.com;
    access_log /var/log/nginx/asm-canary.access.log asm_private;
    # Reduce legacy query exposure in routine upstream/rate-limit error messages.
    # Critical nginx events may still include request context; protect log access.
    error_log /var/log/nginx/asm-canary.error.log crit;
    server_tokens off;
    client_max_body_size 4k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 15s;
    ssl_certificate /etc/letsencrypt/live/asm.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asm.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:asm_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    limit_req_status 429;
    limit_conn_status 429;

    # Apply one consistent policy, including nginx-generated errors.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cache-Control;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        include /etc/nginx/snippets/asm-proxy.conf;
    }
    location ~ /\. {
        return 404;
    }
}
