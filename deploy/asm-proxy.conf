limit_req zone=asm_read burst=20 nodelay;
limit_req zone=asm_write burst=8 nodelay;
limit_req zone=asm_session burst=4 nodelay;
limit_conn asm_conn 6;
limit_conn asm_total 24;
limit_conn asm_import_total 1;
proxy_pass http://127.0.0.1:34624;
proxy_http_version 1.1;
proxy_request_buffering on;
proxy_buffering on;
proxy_connect_timeout 3s;
proxy_read_timeout 20s;
proxy_send_timeout 5s;
proxy_set_header Host asm.micutu.com;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection close;
